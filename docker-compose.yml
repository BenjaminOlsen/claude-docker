services:
  claude-docker:
    build: .
    container_name: claude-${CLAUDE_INSTANCE:-default}
    ports:
      - "${SSH_PORT:-2222}:22"
    volumes:
      # Your SSH public key (for git push authentication)
      - ${SSH_PUBKEY:-~/.ssh/id_ed25519.pub}:/home/git/.ssh/authorized_keys:ro
      # Persistent SSH host keys (so fingerprint doesn't change on rebuild)
      - ssh-host-keys:/etc/ssh/ssh_host_keys
      # Persistent repos and work dirs
      - repos:/home/git/repos
      - work:/home/git/work
      - logs:/home/git/logs
    cap_add:
      - NET_ADMIN
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - CLAUDE_INSTANCE=${CLAUDE_INSTANCE:-default}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # OAuth token (Pro/Max plan) -- generate with: claude setup-token
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Firewall: set to "false" to allow unrestricted outbound access
      - FIREWALL_ENABLED=${FIREWALL_ENABLED:-true}
      # Firewall: comma-separated extra domains to whitelist
      - FIREWALL_ALLOW_EXTRA=${FIREWALL_ALLOW_EXTRA:-}
    restart: unless-stopped

volumes:
  ssh-host-keys:
  repos:
  work:
  logs:
